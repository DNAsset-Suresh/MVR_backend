services:
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mvr
      POSTGRES_USER: mvr_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment file}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in your environment file}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvr_owner -d mvr"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    image: mvr-booking-platform:local
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mvr_owner:${POSTGRES_PASSWORD}@database:5432/mvr
    command: ["node", "scripts/container-migrate.js"]
    restart: "no"
  app:
    build: .
    image: mvr-booking-platform:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ${MVR_ENV_FILE:-.env}
        required: true
    environment:
      DATABASE_URL: postgresql://mvr_app:${APP_DB_PASSWORD}@database:5432/mvr
      HOST: 0.0.0.0
      PORT: 3000
      UPLOAD_DIR: /app/.local/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/.local/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres_data:
  uploads:
